<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NextWave 좌석 예약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 팀 사이트(NextWave)의 네이비 잉크 + 주황 포인트를 이어받음. 상단 바 + 본문 1열, 예약 화면은 도면 | 선택 패널 */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --sunk:#EFEDE8; --ink:#172B3C; --muted:#5D6B78; --line:#E1DED7;
  --accent:#D75432; --accent-2:#BF4526; --on-accent:#FFFFFF; --hl:#2F7A68; --hl-soft:#DDEEE8;
  --ok:#2A7A55; --warn:#A8610B; --bad:#B13E36; --info:#2B5C8C; --info-soft:#DCE8F4;
  --seat-free:#FFFFFF; --seat-booked:#CDD3D8; --seat-wall:#172B3C; --floor:#FBFAF8; --glass:#8DB4D3;
  --sans:Inter,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --surface:#16212C; --sunk:#1D2A36; --ink:#E6ECF1; --muted:#98A6B3; --line:#2A3846;
  --accent:#EE7A57; --accent-2:#F49473; --on-accent:#1A0E09; --hl:#5DB89F; --hl-soft:#18332C;
  --ok:#5DB08A; --warn:#E3A048; --bad:#E07A70; --info:#7EB0E0; --info-soft:#1C2B3A;
  --seat-free:#1D2A36; --seat-booked:#33414E; --seat-wall:#AFC0CE; --floor:#121C26; --glass:#4E7FA6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#16212C; --sunk:#1D2A36; --ink:#E6ECF1; --muted:#98A6B3; --line:#2A3846;
  --accent:#EE7A57; --accent-2:#F49473; --on-accent:#1A0E09; --hl:#5DB89F; --hl-soft:#18332C;
  --ok:#5DB08A; --warn:#E3A048; --bad:#E07A70; --info:#7EB0E0; --info-soft:#1C2B3A;
  --seat-free:#1D2A36; --seat-booked:#33414E; --seat-wall:#AFC0CE; --floor:#121C26; --glass:#4E7FA6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:22px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.brand b{font-size:17px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;padding:8px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button.on{color:var(--accent);background:var(--sunk)}
.top-r{display:flex;align-items:center;gap:8px;position:relative}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.bell svg{width:18px;height:18px}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who .tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--hl-soft);color:var(--warn);font-weight:700}
.drop{position:absolute;right:0;top:46px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:40;overflow:hidden}
.drop header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.drop ul{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto}
.drop li{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.drop li.unread{background:var(--hl-soft)}
.drop li b{display:block;font-size:14px}
.drop li time{font-size:11.5px;color:var(--muted)}
.drop .empty{padding:24px 14px;color:var(--muted);text-align:center}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.in.bad{border-color:var(--bad)}
textarea.in{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}

/* layout blocks */
main{padding-block:28px 64px}
.stack{display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
.panel>h3{margin-bottom:12px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.hl{background:var(--hl-soft);color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty-box{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;gap:18px;justify-content:center}
.hero h1{font-size:clamp(28px,4.2vw,42px);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-photo{position:relative;border-radius:10px;overflow:hidden;min-height:300px;background:var(--sunk);border:1px solid var(--line)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.hero-photo svg{position:absolute;inset:0;width:100%;height:100%}
.hero-photo .cap{position:absolute;left:12px;bottom:12px;right:12px;font-size:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:6px}
.live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.live div{padding:12px 14px;border-right:1px solid var(--line)}
.live div:last-child{border-right:0}
.live b{display:block;font-size:22px;font-family:var(--mono)}
.live span{font-size:12px;color:var(--muted)}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ptable{width:100%;font-size:14px}
.ptable td{padding:6px 0;border-bottom:1px dashed var(--line);white-space:normal}
.ptable td:last-child{text-align:right;font-family:var(--mono)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rules li{margin-bottom:6px}
.rules ul{padding-left:18px;margin:0;font-size:14px}

/* booking */
.book{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer;text-align:center;min-width:56px;line-height:1.25}
.day small{display:block;font-size:11px;color:var(--muted)}
.day.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.day.on small{color:inherit;opacity:.85}
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--floor)}
.map{display:block;width:100%;min-width:640px;height:auto}
.seat{cursor:pointer}
.seat .d{fill:var(--seat-free);stroke:var(--accent);stroke-width:1.4}
.seat .c{fill:var(--seat-free);stroke:var(--accent);stroke-width:1.2}
.seat text{font-family:var(--mono);font-size:10px;fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.seat:hover .d,.seat:focus-visible .d{fill:color-mix(in srgb,var(--accent) 16%,var(--seat-free))}
.seat:focus{outline:none}
.seat.st-booked .d,.seat.st-booked .c,.seat.st-fixed .d,.seat.st-fixed .c{fill:var(--seat-booked);stroke:var(--muted)}
.seat.st-inuse .d,.seat.st-inuse .c{fill:var(--info-soft);stroke:var(--info)}
.seat.st-off .d{fill:url(#hatch);stroke:var(--bad)}
.seat.st-off .c{fill:var(--seat-booked);stroke:var(--bad)}
.seat.st-mine .d,.seat.st-mine .c{fill:var(--hl-soft);stroke:var(--hl);stroke-width:2}
.seat.st-fixedopen .d{fill:var(--seat-free);stroke:var(--accent);stroke-dasharray:3 2}
.seat.sel .d{fill:var(--accent);stroke:var(--accent)}
.seat.sel .c{fill:var(--accent);stroke:var(--accent)}
.seat.sel text{fill:var(--on-accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--accent);vertical-align:-2px;margin-right:5px;background:var(--seat-free)}
.legend i.b{background:var(--seat-booked);border-color:var(--muted)}
.legend i.u{background:var(--info-soft);border-color:var(--info)}
.legend i.o{background:repeating-linear-gradient(45deg,var(--seat-booked) 0 3px,transparent 3px 6px);border-color:var(--bad)}
.legend i.m{background:var(--hl-soft);border-color:var(--hl)}
.legend i.s{background:var(--accent)}
.legend i.f{border-style:dashed}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.sel-seat{font-size:30px;font-family:var(--mono);font-weight:500;letter-spacing:-.02em}
.price{font-size:26px;font-family:var(--mono)}
.notice-bar{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--hl-soft);font-size:13.5px}
.notice-bar.info{background:var(--info-soft)}
.notice-bar.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}

/* passes */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:12px}
.plan .opts{display:grid;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;background:var(--surface);font-size:14px;text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .num{font-weight:500}
.benefit{font-size:13px;color:var(--muted);padding-left:16px;margin:0}

/* reservations */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rcard{display:grid;gap:10px}
.rcard .top-line{display:flex;justify-content:space-between;align-items:center}
.rcard .big{font-family:var(--mono);font-size:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--mono)}
.chart .bar{fill:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.chart .bar.now{fill:var(--hl)}
.chart .grid{stroke:var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.radio-row{display:flex;flex-wrap:wrap;gap:6px}
.radio-row label{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:13.5px;display:flex;gap:6px;align-items:center}
.radio-row label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.radio-row input{accent-color:var(--accent)}
.price-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(560px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0}
.modal .body{padding:20px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.methods label{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.methods label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.methods input{accent-color:var(--accent)}
.qr{display:grid;place-items:center;gap:8px;padding:12px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.qr svg{width:180px;height:180px}
.qr .code{font-family:var(--mono);font-size:20px;letter-spacing:.2em;color:#17222A}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mode-note{font-size:12px;color:var(--muted);text-align:center;padding:16px}
.brand .wm{font-size:21px;font-weight:800;letter-spacing:-.03em}
.brand .wm i{font-style:normal;color:var(--accent);margin-left:2px}
.eyebrow.dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hl);margin-right:8px;vertical-align:2px}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.spaces .panel b.tag{font-size:11px;letter-spacing:.12em;color:var(--accent)}
.verify{display:flex;gap:8px}
.verify .in{flex:1}
.ok-badge{font-size:12.5px;color:var(--ok);font-weight:700}
.demo-code{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--hl-soft);color:var(--ink)}
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:stretch}
.map-box{position:relative;min-height:340px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);isolation:isolate}
#nw-map{position:absolute;inset:0}
.map-fallback{position:absolute;inset:0;z-index:5}
.map-fallback svg{width:100%;height:100%;display:block}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:500}
.faq p{margin-top:8px;color:var(--muted);font-size:14px}
/* Leaflet 최소 스타일 (외부 CSS를 불러올 수 없어 필요한 부분만 인라인) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:var(--sunk);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.leaflet-container img.leaflet-tile{max-width:none!important;width:256px;height:256px;user-select:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-marker-pane{z-index:600}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{float:right;margin-right:0}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:6px;overflow:hidden}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:30px;text-align:center;text-decoration:none;background:#fff;color:#172B3C;font:700 18px/30px var(--sans);border-bottom:1px solid #ddd}
.leaflet-control-attribution{background:rgba(255,255,255,.85);padding:0 6px;font-size:11px;color:#333}
.leaflet-control-attribution a{color:#2B5C8C}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.nw-pin{display:grid;place-items:center}
.nw-pin span{display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#D75432;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:1080px){
  .top-in{flex-wrap:wrap;gap:6px 12px;padding-block:8px}
  .nav{order:3;flex-basis:100%}
  .top-r{margin-left:auto}
}
@media (max-width:980px){
  .book,.split{grid-template-columns:1fr}
  .side{position:static}
  .plans{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .hero,.price-grid,.rules,.spaces,.loc{grid-template-columns:1fr}
  .hero-photo{min-height:200px}
  .plans,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .who .nm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===== 기본 유틸 ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const DOW='일월화수목금토';
const fmtDate=s=>{const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;};
const fmtTs=t=>{if(!t)return '';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const uid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const code6=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};
const durLabel=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r?(h?' ':'')+r+'분':'');};
const fmtPhone=v=>{const d=String(v).replace(/\D/g,'').slice(0,11);if(d.length<4)return d;if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);};

function freePrice(mins){
  const P=SET().prices,t=[...P.free].sort((a,b)=>a.h-b.h),h=mins/60;
  if(h>t[t.length-1].h)return P.dayMax;
  if(h<=t[0].h)return Math.ceil(t[0].p*Math.max(h,1)/t[0].h/100)*100;
  for(let i=1;i<t.length;i++){if(h<=t[i].h){const a=t[i-1],b=t[i];return Math.ceil((a.p+(b.p-a.p)*(h-a.h)/(b.h-a.h))/100)*100;}}
  return P.dayMax;
}

  patch(col,id,p){const cur=D[col][id];if(!cur)return Promise.resolve();return Store.put(col,id,{...cur,...p});},
  del(col,id){const m={...D[col]};delete m[id];D[col]=m;schedule();
    if(!db){saveLocal();return Promise.resolve();}

async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);
  try{if(crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=5381;for(const b of data)h=((h<<5)+h+b)|0;return 'f'+(h>>>0).toString(16);
}

/* 노쇼 자동 취소·자동 퇴실 처리 (열려 있는 화면 어디서든 1분마다) */
function sweep(){
  if(!ready||R.on)return;const t=today(),n=nowMin(),S0=SET();
  resList().forEach(r=>{
    if(r.status==='booked'&&(r.date<t||(r.date===t&&n>r.start+S0.graceMin))){
      Store.patch('reservations',r.id,{status:'noshow',noshowAt:Date.now()});
      notifyAdmin('노쇼 자동 취소',`${r.name} · ${r.seatId} · ${fmtDate(r.date)} ${hm(r.start)} 예약이 체크인되지 않아 자동 취소되고 좌석이 다시 열렸습니다.`,'ns-a-'+r.id);
      const u=D.users[r.userId];
      if(u){
        const list=[...(u.noShows||[]).filter(x=>x.rid!==r.id),{rid:r.id,at:Date.now()}];
        const recent=list.filter(x=>Date.now()-x.at<30*864e5).length;
        const p={noShows:list};
        if(recent>=S0.noshowLimit){p.blockedUntil=Date.now()+S0.blockDays*864e5;}
        Store.patch('users',u.id,p);
        notify(u.id,'노쇼로 예약이 취소되었습니다',`${r.seatId} ${hm(r.start)} 예약이 시작 ${S0.graceMin}분이 지나도 체크인되지 않아 자동 취소되었습니다. 최근 30일 노쇼 ${recent}회`+(p.blockedUntil?` · ${S0.blockDays}일간 예약이 제한됩니다.`:''),'ns-'+r.id);
      }
      if(r.date===t)notifyWaiters(SEAT[r.seatId]?.zone,t);
    }else if(r.status==='checkedin'&&(r.date<t||(r.date===t&&n>=r.end))){
      Store.patch('reservations',r.id,{status:'done',checkoutAt:Date.now(),autoOut:true});
    }
  });
  Object.values(D.waitlist).forEach(w=>{if(w.status==='waiting'&&(w.date<t||(w.date===t&&n>=w.end)))Store.patch('waitlist',w.id,{status:'expired'});});
  Object.values(D.passes).forEach(p=>{if(p.status==='active'&&p.endDate<t)Store.patch('passes',p.id,{status:'expired'});});
}

  }else{

      ${info.st==='mine'?`<button class="btn block" data-act="nav" data-v="my">내 예약 보기</button>`:zoneFree?`<p class="small muted">같은 구역에 같은 시간 빈자리가 ${zoneFree}석 있습니다.</p>`:`<p class="small">이 시간 ${z.label}이 모두 찼습니다. 취소가 나오면 알림을 보내드릴까요?</p><button class="btn block" data-act="waitlist">빈자리 알림 신청</button>`}`;

function payMethods(extra){

const PM={card:'카드',kakao:'카카오페이',naver:'네이버페이',toss:'토스페이',hours:'시간권 차감',period:'정기권',cash:'현금',onsite:'현장 카드'};
function doReserve(){
  if(R.on)return rReserve();
  const me=ME();if(!me){openLogin('book');return;}
  const b=S.book,s=b.start,e=s+b.dur,seat=SEAT[b.seat];
  if(resList().some(r=>ACTIVE(r)&&r.userId===me.id&&r.date===b.date&&overlap(r.start,r.end,s,e))){toast('같은 시간에 이미 다른 예약이 있습니다. 내 예약에서 확인하세요.');return;}
  const price=priceFor(seat.id,b.dur),passes=myPasses(me.id,b.date),z=ZONES[seat.zone];
  const hp=passes.find(p=>p.kind==='hours'&&p.hoursLeft*60>=b.dur);
  const pp=passes.find(p=>p.kind==='period'&&p.startDate<=b.date&&p.endDate>=b.date);
  const extra=[];if(pp)extra.push(['period','정기권 (0원)']);if(hp)extra.push(['hours',`시간권 ${durLabel(b.dur)} 차감`]);
  S.modal={type:'pay',title:'예약 결제',lines:[['좌석',`${seat.id} · ${z.label}`],['일시',`${fmtDate(b.date)} ${hm(s)}–${hm(e)}`],['이용 시간',durLabel(b.dur)]],amount:price,extra,
    onPaid:async pm=>{
      if(seatInfo(seat,b.date,s,e).st!=='free'){toast('방금 다른 분이 이 자리를 예약했습니다. 다른 자리를 골라 주세요.');return false;}
      const id=uid('r'),amt=pm==='period'||pm==='hours'?0:price;
      await Store.put('reservations',id,{code:code6(),userId:me.id,name:me.name,phone:me.phone,seatId:seat.id,date:b.date,start:s,end:e,price:amt,listPrice:price,pay:pm,passId:pm==='hours'?hp.id:pm==='period'?pp.id:null,hoursUsed:pm==='hours'?b.dur/60:0,status:'booked',source:'app',createdAt:Date.now()});
      if(pm==='hours')await Store.patch('passes',hp.id,{hoursLeft:+(hp.hoursLeft-b.dur/60).toFixed(2)});
      notify(me.id,'예약이 확정되었습니다',`${seat.id} · ${fmtDate(b.date)} ${hm(s)}–${hm(e)} · ${PM[pm]} ${won(amt)}. 시작 ${SET().graceMin}분 안에 QR 체크인해 주세요.`);
      Object.values(D.waitlist).filter(w=>w.userId===me.id&&w.date===b.date&&w.zone===seat.zone&&w.status!=='done').forEach(w=>Store.patch('waitlist',w.id,{status:'done'}));
      S.book.seat=null;go('my',{mytab:'now'});toast('예약이 확정되었습니다. QR 코드는 내 예약에서 볼 수 있습니다.');return true;
    }};
  render();
}

function vPasses(){

  const using=k=>me&&k!=='hours'?activePassOf(me.id,k):null;
  const opt=(kind,i,label,price,sub)=>`<button class="opt" data-act="buypass" data-k="${kind}" data-i="${i}" ${using(kind)?'disabled title="이미 이용 중인 멤버십이 있습니다" style="opacity:.45;cursor:not-allowed"':''}><span>${label}${sub?`<br><small class="muted">${sub}</small>`:''}</span><span class="num">${won(price)}</span></button>`;

    <div class="panel plan"><div><div class="eyebrow">TIME PASS</div><h3>시간권</h3></div><ul class="benefit"><li>예약할 때 이용 시간만큼 차감</li><li>유효기간 안에 나눠서 사용</li><li>취소 시 환불 규정에 따라 시간 복원</li></ul><div class="opts">${P.hours.map((r,i)=>opt('hours',i,`${r.h}시간`,r.p,`${r.days}일 유효 · 시간당 ${won(r.p/r.h)}`)).join('')}</div></div>
    <div class="panel plan"><div><div class="eyebrow">FLEX MEMBERSHIP</div><h3>자유석 멤버십</h3></div><ul class="benefit"><li>기간 내 A·B·C·D 좌석 예약 0원</li><li>매일 원하는 자리를 골라 예약</li><li>오늘부터 시작</li></ul><div class="opts">${P.period.map((r,i)=>opt('period',i,`${r.w}주`,r.p,`하루 ${won(r.p/(r.w*7))} 꼴`)).join('')}</div></div>
    <div class="panel plan"><div><div class="eyebrow">TEAM MEMBERSHIP</div><h3>팀 멤버십</h3></div><ul class="benefit"><li>프로젝트룸 1개(4석) 팀 전용</li><li>팀원 3명까지 이메일로 초대</li><li>${P.team[0].d}일 · 1인 환산 ${won(P.team[0].p/4)}</li></ul>
      <div class="field"><label for="tm-room">프로젝트룸</label><select class="in" id="tm-room">${rooms.length?rooms.map(r=>`<option value="${r}">PROJECT ROOM 0${r}</option>`).join(''):'<option value="">남은 룸 없음</option>'}</select></div>
      <div class="field"><label for="tm-mem">팀원 이메일 (쉼표로 구분, 최대 3명)</label><input class="in" id="tm-mem" placeholder="a@school.ac.kr, b@school.ac.kr"></div>
      <div class="opts">${P.team.map((r,i)=>opt('team',i,`4인 ${r.d}일`,r.p)).join('')}</div></div>
    <div class="panel plan"><div><div class="eyebrow">LOCKER</div><h3>사물함</h3></div><ul class="benefit"><li>번호는 구매 시 자동 배정</li><li>사물함 40칸 (복도 쪽)</li></ul><div class="opts">${P.locker.map((r,i)=>opt('locker',i,`${r.w}주`,r.p)).join('')}</div></div>

function freeRooms(days){const end=addDays(today(),days-1),t=today();
  return ROOMS.filter(r=>!Object.values(D.passes).some(p=>p.kind==='team'&&p.status==='active'&&p.room===r&&p.startDate<=end&&p.endDate>=t)
    &&!roomSeats(r).some(s=>{const ov=D.seatStatus[s.id];return ov&&ov.status==='broken';}));}
function passCard(p){
  const lab={hours:'시간권',period:'자유석 멤버십',team:'팀 멤버십',locker:'사물함'}[p.kind];

  return `<div class="panel rcard" style="padding:14px"><div class="top-line"><b>${lab} ${esc(p.label)}</b><span class="pill ok">사용 중</span></div><div class="small">${detail}</div><div class="small muted">${p.startDate} ~ ${p.endDate}</div></div>`;

/* 같은 종류 멤버십을 이미 쓰고 있으면 중복 결제를 막는다 (시간권은 충전형이라 제외) */
function activePassOf(userId,kind){return myPasses(userId).find(p=>p.kind===kind);}
const PASS_NAME={hours:'시간권',period:'자유석 멤버십',team:'팀 멤버십',locker:'사물함'};
function buyPass(k,i){
  const me=ME();if(!me){openLogin('passes');return;}
  const P=SET().prices,t=today();let item,pass;
  if(k!=='hours'){const cur=activePassOf(me.id,k);
    if(cur){S.modal={type:'notice',title:'이미 이용 중인 멤버십이 있습니다',body:`${PASS_NAME[k]} ${cur.label}을(를) ${cur.endDate}까지 이용 중이라 같은 멤버십을 또 결제할 수 없습니다. 기간이 끝난 뒤 다시 구매해 주세요.`};render();return;}}
  if(k==='hours'){item=P.hours[i];pass={kind:'hours',label:`${item.h}시간`,hoursTotal:item.h,hoursLeft:item.h,startDate:t,endDate:addDays(t,item.days-1)};}
  if(k==='period'){item=P.period[i];pass={kind:'period',label:`${item.w}주`,startDate:t,endDate:addDays(t,item.w*7-1)};}
  if(k==='team'){item=P.team[i];const room=+val('tm-room');
    if(!room||!freeRooms(item.d).includes(room)){toast('남은 프로젝트룸이 없습니다.');return;}
    const mem=val('tm-mem').split(/[,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);
    if(mem.length>3){toast('팀원은 본인 외 3명까지 초대할 수 있습니다.');return;}
    const badMail=mem.find(x=>!EMAIL_RE.test(x));if(badMail){toast(`${badMail}는 이메일 형식이 아닙니다.`);return;}
    const end=addDays(t,item.d-1);
    if(resList().some(r=>ACTIVE(r)&&SEAT[r.seatId]?.room===room&&r.date>=t&&r.date<=end&&r.userId!==me.id)){toast(`ROOM 0${room}에 이미 다른 분의 예약이 있습니다. 다른 룸을 고르세요.`);return;}
    pass={kind:'team',label:`ROOM 0${room} ${item.d}일`,room,members:mem,startDate:t,endDate:end};}
  if(k==='locker'){item=P.locker[i];const end=addDays(t,item.w*7-1),used=new Set(Object.values(D.passes).filter(p=>p.kind==='locker'&&p.status==='active'&&p.endDate>=t).map(p=>p.lockerNo));
    let no=1;while(used.has(no)&&no<=40)no++;if(no>40){toast('남은 사물함이 없습니다.');return;}
    pass={kind:'locker',label:`${item.w}주`,lockerNo:no,startDate:t,endDate:end};}
  const name={hours:'시간권',period:'자유석 멤버십',team:'팀 멤버십',locker:'사물함'}[k];
  const lines=[['상품',name+' '+pass.label],['이용 기간',`${pass.startDate} ~ ${pass.endDate}`]];
  if(pass.members&&pass.members.length)lines.push(['팀원',pass.members.join(', ')]);if(pass.lockerNo)lines.push(['사물함',pass.lockerNo+'번']);
  S.modal={type:'pay',title:'멤버십 결제',lines,amount:item.p,onPaid:async pm=>{
    await Store.put('passes',uid('p'),{...pass,userId:me.id,name:me.name,price:item.p,pay:pm,status:'active',createdAt:Date.now()});
    notify(me.id,'멤버십 구매 완료',`${lines[0][1]} · ${pass.startDate}~${pass.endDate}`);
    if(pass.members)pass.members.forEach(m=>{const u=Object.values(D.users).find(x=>x.loginId===m);if(u)notify(u.id,'팀 멤버십에 초대되었습니다',`${me.name}님의 팀으로 PROJECT ROOM 0${pass.room}을 ${pass.endDate}까지 함께 씁니다.`);});
    toast('멤버십이 등록되었습니다.');return true;}};
  render();
}

/* ===== 관리자: 대시보드 ===== */
function vDash(){
  const t=today(),n=nowMin(),st=SET(),rs=resList(),todays=rs.filter(r=>r.date===t);
  const inUse=rs.filter(r=>r.status==='checkedin'&&r.date===t).length,fixedNow=ROOMS.filter(r=>teamPassOn(r,t)).length;
  const upcoming=todays.filter(r=>r.status==='booked').length,ns=todays.filter(r=>r.status==='noshow');
  const isToday=x=>ymd(new Date(x.createdAt))===t;
  const rev=rs.filter(isToday).reduce((a,r)=>a+(r.status==='cancelled'?r.price-(r.refund||0):r.price),0)+Object.values(D.passes).filter(isToday).reduce((a,p)=>a+p.price,0);
  const openComp=compList().filter(c=>c.status!=='완료').length;
  const hours=[];for(let h=Math.floor(st.open/60);h<Math.ceil(st.close/60);h++)hours.push(h);
  const cap=BOOKABLE.length;
  const vals=hours.map(h=>todays.filter(r=>r.status!=='cancelled'&&r.status!=='noshow'&&overlap(r.start,r.end,h*60,h*60+60)).length);
  const W=720,H=200,pl=34,pb=24,bw=(W-pl-10)/hours.length,maxV=Math.max(4,...vals),yS=v=>H-pb-(v/maxV)*(H-pb-14);
  const grid=[0,.5,1].map(f=>{const v=Math.round(maxV*f);return `<line class="grid" x1="${pl}" x2="${W-6}" y1="${yS(v)}" y2="${yS(v)}"/><text x="${pl-6}" y="${yS(v)+4}" text-anchor="end">${v}</text>`;}).join('');
  const bars=hours.map((h,i)=>`<rect class="bar ${h===Math.floor(n/60)?'now':''}" x="${pl+i*bw+2}" y="${yS(vals[i])}" width="${bw-4}" height="${Math.max(0,H-pb-yS(vals[i]))}" rx="2"><title>${h}시 ${vals[i]}건 (${Math.round(vals[i]/cap*100)}%)</title></rect>${i%2===0?`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${h}</text>`:''}`).join('');
  const refunds=rs.filter(r=>r.status==='cancelled').sort((a,b)=>b.cancelledAt-a.cancelledAt).slice(0,6);
  return `<div class="head"><div><h2>대시보드</h2><p>${fmtDate(t)} ${hm(n)} 기준 · 운영 ${hm(st.open)}–${hm(st.close)}</p></div><div class="row">${R.on?'<button class="btn" data-act="anoshow">노쇼 처리 실행</button>':''}<button class="btn" data-act="atab" data-v="walk">현장 접수</button></div></div>
  <div class="stack">
  <div class="kpis">
    <div class="kpi"><span>지금 이용중</span><b>${inUse}<small> / ${cap}</small></b><small>팀 전용 룸 ${fixedNow}개</small></div>
    <div class="kpi"><span>오늘 체크인 대기</span><b>${upcoming}</b><small>예약 ${todays.length}건 중</small></div>
    <div class="kpi"><span>오늘 노쇼 자동취소</span><b style="color:${ns.length?'var(--bad)':'inherit'}">${ns.length}</b><small>유예 ${st.graceMin}분</small></div>
    <div class="kpi"><span>오늘 결제 (환불 차감)</span><b>${rev.toLocaleString('ko-KR')}</b><small>원</small></div>
    <div class="kpi"><span>미처리 민원</span><b style="color:${openComp?'var(--warn)':'inherit'}">${openComp}</b><small><a href="#" data-act="atab" data-v="acomp">민원 보기</a></small></div>
  </div>
  <div class="panel"><div class="spread"><h3 style="margin:0">오늘 시간대별 예약 (혼잡도)</h3><span class="small muted">시간마다 겹치는 예약 건수 · 노란 막대가 현재 시간</span></div><div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;display:block;margin-top:10px">${grid}${bars}</svg></div></div>
  <div class="split">
    <div class="panel"><h3>노쇼 자동취소 · 좌석 재오픈</h3>${ns.length?`<div class="tbl-wrap"><table><thead><tr><th>좌석</th><th>예약자</th><th>시간</th><th>처리</th></tr></thead><tbody>${ns.map(r=>`<tr><td class="mono">${r.seatId}</td><td>${esc(r.name)}</td><td class="num">${hm(r.start)}–${hm(r.end)}</td><td>${fmtTs(r.noshowAt)} 재오픈</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">오늘 노쇼로 취소된 예약이 없습니다.</p>'}</div>
    <div class="panel"><h3>최근 취소 · 환불 계산</h3>${refunds.length?`<div class="tbl-wrap"><table><thead><tr><th>좌석</th><th>예약자</th><th>비율</th><th class="r">환불</th></tr></thead><tbody>${refunds.map(r=>`<tr><td class="mono">${r.seatId}</td><td>${esc(r.name)}</td><td>${Math.round((r.refundRatio||0)*100)}%</td><td class="r num">${r.refundHours?r.refundHours+'시간':won(r.refund||0)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">취소 내역이 없습니다.</p>'}</div>
  </div></div>`;
}

/* ===== 관리자: 좌석 관리 ===== */

/* ===== 관리자: 현장 접수 ===== */
function vWalk(){
  const t=today(),n=nowMin(),st=SET(),e=S.errs;
  const start=Math.max(n,st.open),maxDur=st.close-start,open=n<st.close-30;

  const dur=+($('#wk-dur')?.value||120);const end=start+(durs.includes(dur)?dur:(durs[0]||60));
  const free=BOOKABLE.filter(s=>seatInfo(s,t,start,end).st==='free');
  const waits=Object.values(D.waitlist).filter(w=>!w.userId&&w.date===t&&(w.status==='waiting'||w.status==='notified')).sort((a,b)=>a.createdAt-b.createdAt);
  return `<div class="head"><div><h2>현장 접수</h2><p>방문 고객의 좌석 배정·결제·즉시 체크인, 만석 시 대기 등록, 입구 QR 단말 처리를 한 화면에서 합니다.</p></div></div>
  <div class="split"><form class="panel stack" data-form="walkin" style="gap:14px" novalidate>
    <h3 style="margin:0">방문 고객 좌석 배정</h3>
    ${open?'':`<div class="notice-bar">영업 종료 30분 전부터는 현장 접수를 받을 수 없습니다.</div>`}

function kioskResult(){
  if(!S.kiosk)return '';const r=resList().find(x=>x.code===S.kiosk);
  if(!r)return `<div class="notice-bar bad">예약번호 ${esc(S.kiosk)}를 찾을 수 없습니다. 글자를 다시 확인하세요.</div>`;
  const t=today(),canIn=r.status==='booked'&&r.date===t&&nowMin()>=r.start-10;
  return `<div class="panel" style="padding:12px;background:var(--sunk)"><div class="spread"><b>${esc(r.name)} · <span class="mono">${r.seatId}</span></b>${resStatusPill(r)}</div><div class="small num">${fmtDate(r.date)} ${hm(r.start)}–${hm(r.end)}</div><div class="row" style="margin-top:8px">${r.status==='booked'?`<button class="btn sm pri" type="button" data-act="ain" data-id="${r.id}" ${canIn?'':'disabled'}>체크인</button>${canIn?'':'<span class="small muted">오늘 시작 10분 전부터 체크인 가능</span>'}`:r.status==='checkedin'?`<button class="btn sm pri" type="button" data-act="checkout" data-id="${r.id}">체크아웃</button>`:''}</div></div>`;
}

    return `<div class="field"><label for="${purpose}-email">이메일</label><div class="verify"><input class="in ${e.email?'bad':''}" id="${purpose}-email" type="email" autocomplete="email" placeholder="name@school.ac.kr" ${ok?'readonly':''}><button class="btn" type="button" data-act="sendcode" data-p="${purpose}" ${ok?'disabled':''}>${sent?'다시 받기':'인증번호 받기'}</button></div>${e.email?`<span class="err">${e.email}</span>`:''}</div>

      ${V.demo?`<div class="demo-code">메일 발송이 아직 설정되지 않아 시연 모드로 진행합니다. 인증번호: <b class="mono">${V.code}</b></div>`:''}`:''}

    <div class="grid2"><div class="field"><label for="su-pw">비밀번호</label><input class="in ${e.pw?'bad':''}" id="su-pw" type="password" autocomplete="new-password">${er('pw')||'<span class="hint">8자 이상, 영문+숫자</span>'}</div>
    <div class="field"><label for="su-pw2">비밀번호 확인</label><input class="in ${e.pw2?'bad':''}" id="su-pw2" type="password" autocomplete="new-password">${er('pw2')}</div></div>

/* 인증번호 메일: 관리자 설정에 EmailJS 키가 있으면 실제 발송, 없거나 막히면 화면에 보여주는 시연 모드 */
async function sendCode(email,purpose){
  const code=String(Math.floor(100000+Math.random()*900000));
  S.verify={email,code,purpose,exp:Date.now()+5*60000,ok:false,demo:false,sentAt:Date.now()};
  const d=DEFAULT_SETTINGS.emailjs,e0=SET().emailjs||{},ej={service:e0.service||d.service,template:e0.template||d.template,key:e0.key||d.key};
  if(ej.service&&ej.template&&ej.key){
    try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({service_id:ej.service,template_id:ej.template,user_id:ej.key,template_params:{to_email:email,code,app_name:SET().cafeName,purpose:purpose==='reset'?'비밀번호 재설정':'회원가입'}})});
      if(r.ok){S.errs={};render();toast(`${email}로 인증번호를 보냈습니다. 메일함(스팸함 포함)을 확인하세요.`);return true;}
    }catch(e){}
  }
  S.verify.demo=true;S.errs={};render();return false;
}

    if(R.signupSent)return shell('인증 메일을 보냈습니다',`<div class="body"><p><b>${esc(R.signupSent)}</b>로 인증 메일을 보냈습니다.</p><p class="small muted">메일의 인증 링크를 누르면 가입이 완료됩니다. 링크는 팀 사이트(NextWave)로 열립니다. 인증한 뒤 이 화면에서 로그인하세요. 메일이 안 보이면 스팸함을 확인하세요.</p><button class="btn pri block" data-act="login">로그인하러 가기</button></div>`);
    return shell('회원가입',`<form data-form="signup" novalidate><div class="body">
    <div class="field"><label for="su-email">이메일</label><input class="in ${e.email?'bad':''}" id="su-email" type="email" autocomplete="email" placeholder="name@school.ac.kr">${er('email')||'<span class="hint">가입하면 이 주소로 인증 메일이 갑니다</span>'}</div>
    <div class="grid2"><div class="field"><label for="su-pw">비밀번호</label><input class="in ${e.pw?'bad':''}" id="su-pw" type="password" autocomplete="new-password">${er('pw')||'<span class="hint">8자 이상, 영문+숫자</span>'}</div>
    <div class="field"><label for="su-pw2">비밀번호 확인</label><input class="in ${e.pw2?'bad':''}" id="su-pw2" type="password" autocomplete="new-password">${er('pw2')}</div></div>
    <div class="field"><label for="su-name">이름</label><input class="in ${e.name?'bad':''}" id="su-name" maxlength="20">${er('name')}</div>
    <label class="check"><input type="checkbox" id="su-agree"> <span>[필수] 개인정보 수집·이용(이메일, 이름)에 동의합니다.</span></label>${er('agree')}
    ${e.req?`<div class="notice-bar bad">${esc(e.req)}</div>`:''}
    <button class="btn pri block" type="submit">가입하고 인증 메일 받기</button>
    <p class="small muted" style="text-align:center">이미 계정이 있나요? <a href="#" data-act="login">로그인</a></p></div></form>`);},
  login:(shell,e)=>shell('로그인',`<form data-form="login" novalidate><div class="body">
    <div class="field"><label for="lg-id">이메일</label><input class="in" id="lg-id" type="email" autocomplete="username"></div>
    <div class="field"><label for="lg-pw">비밀번호</label><input class="in" id="lg-pw" type="password" autocomplete="current-password"></div>
    ${e.login?`<span class="err" style="color:var(--bad);font-size:13px">${esc(e.login)}</span>`:''}
    <button class="btn pri block" type="submit">로그인</button>
    <p class="small muted" style="text-align:center"><a href="#" data-act="signup">회원가입</a> · <a href="#" data-act="reset">비밀번호 찾기</a></p>
    <p class="small muted" style="text-align:center;border-top:1px solid var(--line);padding-top:10px">팀 사이트(NextWave)와 같은 계정으로 로그인합니다.</p></div></form>`),
  reset:(shell,e)=>shell('비밀번호 찾기',R.resetSent?`<div class="body"><p><b>${esc(R.resetSent)}</b>로 재설정 링크를 보냈습니다.</p><p class="small muted">메일의 링크를 눌러 새 비밀번호를 정한 뒤 이 화면에서 로그인하세요.</p><button class="btn pri block" data-act="login">로그인하러 가기</button></div>`
    :`<form data-form="reset" novalidate><div class="body"><div class="field"><label for="rs-email">가입한 이메일</label><input class="in ${e.email?'bad':''}" id="rs-email" type="email">${e.email?`<span class="err">${e.email}</span>`:''}</div><button class="btn pri block" type="submit">재설정 링크 받기</button></div></form>`)
};
const RACT={
  logout:async()=>{await sb.auth.signOut();R.me=null;S.asCustomer=false;go('home');toast('로그아웃되었습니다.');},
  signup:()=>{R.signupSent='';S.modal={type:'signup'};S.errs={};fresh=true;render();},
  reset:()=>{R.resetSent='';S.modal={type:'reset'};S.errs={};fresh=true;render();},
  readall:async()=>{const ids=R.notices.filter(n=>!n.read).map(n=>n.id);if(!ids.length)return;try{await rpc('nw_mark_notifications_read',{p_ids:ids});}catch(e){}rLoadInbox();},
  bell:()=>{S.bell=!S.bell;if(S.bell)rLoadInbox();render();},
  waitlist:async()=>{const me=ME();if(!me){openLogin('book');return;}const b=S.book;
    try{await rpc('nw_join_waitlist',{p_zone:SEAT[b.seat].zone,p_starts_at:kstISO(b.date,b.start),p_ends_at:kstISO(b.date,b.start+b.dur)});toast('빈자리 대기를 등록했습니다. 자리가 나면 알림으로 알려드립니다.');}catch(e){toast(errMsg(e));}},
  showqr:async t=>{const id=t.dataset.id;S.modal={type:'qr',id};render();
    try{const d=await rpc('nw_get_qr',{p_reservation_id:id});if(S.modal&&S.modal.id===id){S.modal.token=d.token;S.modal.exp=d.expires_at;render();}}catch(e){if(S.modal&&S.modal.id===id){S.modal.err=errMsg(e);render();}}},
  selfin:t=>RACT.showqr(t),checkout:t=>RACT.showqr(t),
  ruseqr:async t=>{const r=R.res.find(x=>x.id===t.dataset.id),m=S.modal;if(!r||!m||!m.token)return;
    try{const d=await rpc('nw_use_qr',{p_reservation_id:r.id,p_token:m.token,p_action:r.status==='checkedin'?'check_out':'check_in'});
      if(d&&d.ok===false)throw new Error(d.message||'입퇴실을 기록하지 못했습니다.');S.modal=null;toast(r.status==='checkedin'?'퇴실을 기록했습니다.':'입실을 기록했습니다.');await rLoadMine();}catch(e){toast(errMsg(e));}},
  cancel:async t=>{const id=t.dataset.id;S.modal={type:'cancel',id};render();
    try{const q=await rpc('nw_quote_cancellation',{p_reservation_id:id});if(S.modal&&S.modal.id===id){S.modal.quote=q;render();}}catch(e){if(S.modal&&S.modal.id===id){S.modal.err=errMsg(e);render();}}},
  docancel:async t=>{try{await rpc('nw_cancel_reservation',{p_reservation_id:t.dataset.id,p_reason:val('rc-reason')||null});S.modal=null;toast('예약을 취소했습니다.');await rLoadMine();}catch(e){toast(errMsg(e));}},
  /* 관리자 */
  ain:async t=>{const r=R.res.find(x=>x.id===t.dataset.id);if(!r)return;
    if(r.status==='pending'){try{await rpc('nw_approve_reservation',{p_reservation_id:r.id,p_note:null});toast(`${r.seatId} 예약을 승인했습니다.`);await rLoadMine();}catch(e){toast(errMsg(e));}}
    else toast('입실은 고객이 받은 QR로 기록합니다.');},
  adecline:async t=>{try{await rpc('nw_decline_reservation',{p_reservation_id:t.dataset.id,p_note:null});toast('예약을 반려했습니다.');await rLoadMine();}catch(e){toast(errMsg(e));}},
  anoshow:async()=>{try{const d=await rpc('nw_process_no_shows',{});toast(`노쇼 ${d&&d.no_shows||0}건, 미입금 만료 ${d&&d.expired_unpaid||0}건을 처리했습니다.`);await rLoadMine();rRefreshBase();}catch(e){toast(errMsg(e));}},
  rfall:()=>{S.rf.date=today();render();}
};
const RFORM={
  async login(f){const email=val('lg-id').toLowerCase(),pw=$('#lg-pw').value;
    if(email===DEMO_ADMIN.id&&pw===DEMO_ADMIN.pw){try{await sb.auth.signOut();}catch(e){}await enterDemoAdmin();return FORM.login(f);}
    if(!email||!pw){S.errs={login:'이메일과 비밀번호를 모두 입력하세요.'};render();return;}
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){S.errs={login:/confirm/i.test(error.message)?'이메일 인증이 아직 안 됐습니다. 가입 메일의 인증 링크를 먼저 눌러 주세요.':'이메일 또는 비밀번호가 맞지 않습니다.'};render();return;}
    S.modal=null;S.errs={};S.asCustomer=false;go(S.view);toast('로그인되었습니다.');},
  async signup(){const email=val('su-email').toLowerCase(),pw=$('#su-pw').value,pw2=$('#su-pw2').value,name=val('su-name'),e={};
    if(!EMAIL_RE.test(email))e.email='name@school.ac.kr 형식의 이메일을 입력하세요.';
    if(pw.length<8||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw))e.pw='8자 이상, 영문과 숫자를 함께 넣어 주세요.';
    if(pw!==pw2)e.pw2='비밀번호가 서로 다릅니다.';if(name.length<2)e.name='이름을 2자 이상 입력하세요.';
    if(!$('#su-agree').checked)e.agree='개인정보 수집·이용에 동의해야 가입할 수 있습니다.';
    S.errs=e;if(Object.keys(e).length){render();return;}
    const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:TEAM_SITE+'/account.html'}});
    if(error){S.errs={req:/registered|exists/i.test(error.message)?'이미 가입된 이메일입니다. 로그인하거나 비밀번호 찾기를 이용하세요.':errMsg(error)};render();return;}
    /* 이미 인증까지 끝난 이메일이면 Supabase는 오류 없이 성공처럼 응답하고 메일을 보내지 않는다 */
    if(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){S.errs={req:'이미 가입된 이메일입니다. 로그인하거나 비밀번호 찾기를 이용하세요.'};render();return;}
    R.signupSent=email;S.errs={};render();},
  async reset(){const email=val('rs-email').toLowerCase();if(!EMAIL_RE.test(email)){S.errs={email:'가입한 이메일을 입력하세요.'};render();return;}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:TEAM_SITE+'/account.html'});
    if(error){S.errs={email:errMsg(error)};render();return;}R.resetSent=email;S.errs={};render();},
  async rreq(){const m=S.modal;if(m.busy)return;const boxes=[...document.querySelectorAll('[data-rule]')];
    if(boxes.some(b=>!b.checked)){S.errs={rules:'모든 이용 규칙에 동의해야 예약할 수 있습니다.'};render();return;}
    m.busy=true;S.errs={};render();
    try{const d=await rpc('nw_request_reservation',{p_seat_id:R.seatId[m.seat],p_starts_at:kstISO(m.date,m.s),p_ends_at:kstISO(m.date,m.e),p_rule_ids:boxes.map(b=>b.dataset.rule),p_rule_versions:boxes.map(b=>({id:b.dataset.rule,version:Number(b.dataset.ver)}))});
      const row=Array.isArray(d)?d[0]:d;S.modal=null;S.book.seat=null;R.availKey='';await rLoadMine();go('my',{mytab:'now'});
      toast(`${m.seat} 예약 요청을 저장했습니다. 요금 ${won(row&&row.amount_won||priceFor(m.seat,m.e-m.s))} · 운영자 승인 후 확정됩니다.`);}
    catch(e){m.busy=false;S.errs={req:errMsg(e)};render();}},
  async complaint(){const me=ME(),body=val('cp-body'),cat=document.querySelector('input[name="cat"]:checked')?.value,seat=val('cp-seat').toUpperCase();
    if(body.length<5){S.errs={cpBody:'내용을 5자 이상 적어 주세요.'};render();return;}
    try{await rpc('nw_submit_classified_complaint',{p_seat_id:R.seatId[seat]||null,p_subject:`${cat}${SEAT[seat]?' · '+seat:''}`,p_body:body.slice(0,500),p_category:RCAT[cat]||'other'});
      S.errs={};fresh=true;await rLoadComplaints();toast('접수되었습니다. 처리 상태는 알림으로 알려드립니다.');}catch(e){toast(errMsg(e));}},
  async seatstatus(){const id=S.aSeat,stv=document.querySelector('input[name="sst"]:checked')?.value||'ok',memo=val('sst-memo');
    if(memo.length>40){S.errs={memo:`메모는 40자 이내로 적어 주세요. (지금 ${memo.length}자)`};render();return;}
    try{await rpc('nw_set_seat_status',{p_seat_id:R.seatId[id],p_status:stv==='ok'?'available':'unavailable',p_reason:stv==='ok'?(memo||'정상 확인'):`${STATUS_LABEL[stv]}${memo?' · '+memo:''}`});
      await rRefreshBase();R.availKey='';S.errs={};fresh=true;render();toast(`${id} 상태를 저장했습니다.`);}catch(e){toast(errMsg(e));}},
  async walkin(){const name=val('wk-name'),phone=val('wk-phone'),seat=val('wk-seat'),dur=+val('wk-dur'),e={};
    if(!name)e.wkName='고객 이름을 입력하세요.';if(!PHONE_RE.test(phone))e.wkPhone='010-1234-5678 형식으로 입력하세요.';if(!seat)e.wkSeat='좌석을 고르세요.';
    S.errs=e;if(Object.keys(e).length){render();return;}
    const t=today(),start=Math.max(nowMin(),SET().open),end=Math.min(start+dur,SET().close);
    try{const c=await rpc('nw_register_onsite_customer',{p_display_name:name,p_contact:phone,p_consent:true});
      const cid=typeof c==='string'?c:(c&&(c.id||c.customer_id));
      await rpc('nw_create_onsite_reservation',{p_customer_id:cid,p_seat_id:R.seatId[seat],p_starts_at:null,p_ends_at:kstISO(t,end),p_rule_ids:R.rules.map(r=>r.id),p_verbal_consent:true});
      S.errs={};fresh=true;await rLoadMine();rRefreshBase();R.availKey='';render();toast(`${seat} 현장 예약을 저장했습니다.`);}catch(err){toast(errMsg(err));}},
  async wait(){const name=val('wt-name'),phone=val('wt-phone'),zone=val('wt-zone'),dur=+val('wt-dur'),e={};
    if(!name)e.wtName='대기 고객 이름을 입력하세요.';else if(!PHONE_RE.test(phone))e.wtPhone='010-1234-5678 형식으로 입력하세요.';
    S.errs=e;if(Object.keys(e).length){render();return;}const t=today(),start=Math.max(nowMin(),SET().open);
    try{const c=await rpc('nw_register_onsite_customer',{p_display_name:name,p_contact:phone,p_consent:true});const cid=typeof c==='string'?c:(c&&(c.id||c.customer_id));
      await rpc('nw_join_onsite_waitlist',{p_customer_id:cid,p_zone:zone,p_starts_at:kstISO(t,start),p_ends_at:kstISO(t,Math.min(start+dur,SET().close)),p_consent:true});
      S.errs={};fresh=true;render();toast(`${name}님 대기 등록 완료`);}catch(err){toast(errMsg(err));}},
  async comp(f){const id=f.dataset.id,stv=f.querySelector(`input[name="cs-${id}"]:checked`)?.value,note=val('cr-'+id);
    const map={'처리중':'in_progress','완료':'resolved','접수':'in_progress'};
    try{await rpc('nw_transition_complaint',{p_complaint_id:id,p_status:map[stv]||'in_progress',p_note:note||'운영자가 확인했습니다.'});toast('처리 상태를 저장했습니다. 고객에게 알림이 갑니다.');await rLoadComplaints();}catch(e){toast(errMsg(e));}},
  async pw(){const nw=$('#pw-new').value;if(nw.length<8||!/[a-zA-Z]/.test(nw)||!/\d/.test(nw)){S.errs={nw:'8자 이상, 영문과 숫자를 함께 넣어 주세요.'};render();return;}
    const {error}=await sb.auth.updateUser({password:nw});if(error){S.errs={nw:errMsg(error)};render();return;}S.modal=null;render();toast('비밀번호를 변경했습니다.');},
  async withdraw(){try{const d=await rpc('nw_request_withdrawal',{p_reason:null});
      if(d&&d.status==='blocked'){S.errs={wd:`지금은 탈퇴할 수 없습니다: ${d.blocked_reason||'처리 중인 내역이 있습니다.'}`};render();return;}
      await sb.auth.signOut();S.modal=null;go('home');toast('탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.');}catch(e){S.errs={wd:errMsg(e)};render();}}
};
async function rLoadComplaints(){
  R.compLoaded=true;
  let q=sb.from('nw_complaints').select('id,user_id,seat_id,subject,body,status,created_at,category').order('created_at',{ascending:false}).limit(100);
  if(R.me&&R.me.role!=='admin')q=q.eq('user_id',R.me.id);
  const {data}=await q;R.complaints=(data||[]).map(c=>({id:c.id,userId:c.user_id,name:'회원',category:c.subject||c.category||'문의',seatId:R.codeOf[c.seat_id]||'',content:c.body,status:RCOMP[c.status]||'접수',raw:c.status,createdAt:new Date(c.created_at).getTime()}));
  R.compLoaded=true;schedule();
}
async function rLoadProfiles(){R.profLoaded=true;const {data}=await sb.from('nw_profiles').select('id,display_name,is_admin,created_at').limit(200);R.profiles=data||[];R.profLoaded=true;schedule();}
const RVIEW={
  ausers:()=>{if(!R.profLoaded)rLoadProfiles();return `<div class="head"><div><h2>회원</h2><p>팀 DB(nw_profiles)에 등록된 회원입니다.</p></div></div>
    ${R.profiles.length?`<div class="tbl-wrap"><table><thead><tr><th>이름</th><th>구분</th><th>가입</th><th>ID</th></tr></thead><tbody>${R.profiles.map(p=>`<tr><td>${esc(p.display_name||'-')}</td><td>${p.is_admin?'<span class="pill hl">관리자</span>':'회원'}</td><td>${p.created_at?fmtTs(new Date(p.created_at).getTime()):'-'}</td><td class="mono small">${esc(String(p.id).slice(0,8))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-box">회원 목록을 불러오는 중이거나 볼 권한이 없습니다.</div>'}`;}
};

/* ===== 시작 ===== */
async function init(){
  if(!isDemoAdmin()&&await rInit()){ready=true;render();setInterval(()=>{if(!isEditing()&&!S.modal)render();},60000);return;}
  let ns=null;
  try{if(window.claude&&typeof window.claude.use==='function')ns=await window.claude.use('db');}catch(e){ns=null;}
  if(ns){
    db=ns;MODE='db';const loaded=new Set(),need=COLS.length+1;
    const done=k=>{if(loaded.has(k))return;loaded.add(k);if(loaded.size===need&&!ready){ready=true;ensureAdmin();sweep();render();}};
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});D[c]=m;if(!snap.metadata.fromCache)done(c);schedule();},err=>{done(c);toast('데이터 연결이 끊겼습니다. 새로고침해 주세요.');}));
    db.doc('config/settings').onSnapshot(snap=>{D.settings=snap.exists?snap.data():null;if(!snap.metadata.fromCache)done('settings');schedule();},()=>done('settings'));
    setTimeout(()=>{if(!ready){ready=true;ensureAdmin();render();}},8000);
  }else{
    MODE='local';
    try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);COLS.forEach(c=>D[c]=o[c]||{});D.settings=o.settings||null;}}catch(e){}
    ready=true;await ensureAdmin();sweep();render();
  }
  setInterval(()=>{sweep();if(!isEditing()&&!S.modal)render();},60000);
}
render();init();
</script>
